# can-i probe definitions.
# Exit code 0 = ALLOWED by the current sandbox/policy; anything else = DENIED.
# Edit live from the web UI (✎ checks.yaml) or via: PUT /api/config
version: 1

settings:
  interval_seconds: 3        # continuous-mode loop interval
  default_timeout_seconds: 5

checks:
  # ---- Network -------------------------------------------------------------
  - id: net-https-external
    name: Outbound HTTPS (suse.com)
    category: network
    command: curl -fsS --max-time 3 -o /dev/null https://suse.com
    description: External egress over TLS.
    expect: allowed

  - id: net-dns-lookup
    name: DNS resolution
    category: network
    command: getent hosts opensuse.org
    description: Name resolution via NSS/DNS.
    expect: allowed

  - id: net-https-cloudflare
    name: HTTPS to one.one.one.one (curl)
    category: network
    command: curl -fsS --max-time 3 -o /dev/null https://one.one.one.one
    description: A host the policy doesn't list. Denied until a policy update grants it.

  # Python reading a package index, the way an agent installs packages.
  # Upstream PyPI and SUSE's index are separate endpoints, so policy updates
  # can switch the sandbox between them. The SUSE check is shown only when
  # CANI_SUSE_PYPI_URL is set (the can-i app's "SUSE PyPI index URL").
  - id: net-pypi-upstream
    name: Upstream PyPI (python)
    category: network
    timeout: 8
    command: python3 -c "import urllib.request as u; u.urlopen('https://pypi.org/simple/pip/', timeout=5)"
    description: Python reads the pip project page on pypi.org. Denied until a rule grants python.

  - id: net-pypi-suse
    name: SUSE PyPI (python)
    category: network
    timeout: 8
    command: python3 -c "import urllib.request as u; u.urlopen('${CANI_SUSE_PYPI_URL}', timeout=5)"
    description: Python reads SUSE's package index. Denied until a rule grants python.

  # nmap to a host curl may already reach: egress rules name the binaries
  # allowed to use them, so nmap is denied until it is added to the rule.
  - id: net-nmap-suse
    name: Port scan suse.com:443 (nmap)
    category: network
    timeout: 8
    command: sh -c 'nmap -sT -Pn --system-dns -p443 suse.com | grep -q "443/tcp open"'
    description: Same destination as the curl check, different binary.

  # ---- Filesystem ----------------------------------------------------------
  - id: fs-read-shadow
    name: Read /etc/shadow
    category: filesystem
    command: head -c1 /etc/shadow
    description: Denied by file permissions with or without a sandbox (the control).
    expect: denied

  - id: fs-write-var-tmp
    name: Write to /var/tmp
    category: filesystem
    command: sh -c 'touch /var/tmp/.can-i-probe && rm -f /var/tmp/.can-i-probe'
    description: World-writable, but not in the sandbox's read_write paths, so Landlock denies it.

  - id: fs-write-tmp
    name: Write to /tmp
    category: filesystem
    command: sh -c 'touch /tmp/.can-i-probe && rm -f /tmp/.can-i-probe'
    description: Scratch space write; normally allowed.
    expect: allowed

  - id: fs-exec-tmp
    name: Execute from /tmp
    category: filesystem
    command: sh -c 'printf "#!/bin/sh\nexit 0\n" > /tmp/.can-i-x && chmod +x /tmp/.can-i-x && /tmp/.can-i-x; rc=$?; rm -f /tmp/.can-i-x; exit $rc'
    description: Denied when /tmp is mounted noexec.
    expect: allowed

  # ---- Processes & binaries ------------------------------------------------
  - id: proc-spawn-sh
    name: Spawn a shell (sh)
    category: process
    command: sh -c 'exit 0'
    description: Subprocess creation; blocked by strict OpenShell profiles.
    expect: allowed

  - id: proc-spawn-curl
    name: Spawn curl
    category: process
    command: curl --version
    description: Network-capable binary execution.
    expect: allowed

  # The image ships this tool in /srv/can-i-tools, which the sandbox policy
  # doesn't list. Landlock lets programs run only from listed paths.
  - id: proc-run-unapproved-tool
    name: Run a tool from /srv/can-i-tools
    category: process
    command: /srv/can-i-tools/agent-report
    description: The tool is outside the policy's paths, so Landlock blocks running it. Add /srv/can-i-tools to Extra read-only paths.

  - id: proc-privesc-unshare
    name: Namespace creation (unshare)
    category: process
    timeout: 3
    command: unshare --user --map-root-user true
    description: User-namespace creation. An OpenShell hard limit; seccomp blocks it in every sandbox.
    expect: denied
