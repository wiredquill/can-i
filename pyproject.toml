[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "can-i"
version = "0.1.0"
description = "Security capability inspector and live sandbox demonstration dashboard (TUI + Web)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "textual>=0.86",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
can-i = "cani.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cani"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "container: end-to-end tests that build/run a SUSE BCI container (need podman or docker)",
]
